# I test del negozio sono OFFLINE e indipendenti dal progetto di betting che li
# ospita: senza questo file pytest risale e carica il `conftest.py` della root
# (fixture autouse pesanti, ~2,5s per test) e il plugin di SeleniumBase, che
# inietta un banner e cerca un webdriver a ogni sessione. Misurato il 21/10:
# `pytest test_doctor.py` da questa cartella non finiva in 180s, con questo file
# finisce in ~15s.
[pytest]
addopts = -q -p no:cacheprovider -p no:seleniumbase
testpaths = .
