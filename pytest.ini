[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# `-p no:seleniumbase`: SeleniumBase (automazione GUI) NON e' una dipendenza del
# progetto ma, se presente nell'ambiente, inietta il suo plugin in OGNI run:
# banner, download di webdriver in `downloaded_files/` e lock (`pyautogui.lock`,
# `driver_fixing.lock`) all'avvio della sessione (osservati il 29/09/2026).
# Nessun test lo usa (verificato): disattivarlo rende la suite indipendente da
# cosa c'e' installato intorno. `-p no:` non solleva se il pacchetto manca.
addopts = -q --tb=short -p no:seleniumbase
markers =
    slow: test lenti (richiedono API o rete)
    integration: test di integrazione
asyncio_mode = auto
